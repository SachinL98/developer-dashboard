name: Scheduled sync

# Calls the app's sync endpoints on a schedule (replaces Vercel Cron, which needs a paid plan for frequent runs).
# GitHub may delay scheduled runs by a few minutes, and only runs schedules from the repository's default branch.
on:
  schedule:
    # Every 5 minutes on weekdays, 03:00-12:59 UTC = 08:30-18:29 Sri Lanka time. The app itself only syncs Jira 08:30-17:30.
    - cron: "*/5 3-12 * * 1-5"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Jira, GitHub and meetings sync
        run: |
          curl --fail --show-error --silent --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/sync"
      - name: Meeting transcripts
        run: |
          curl --fail --show-error --silent --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/transcripts"
      - name: Monthly 1:1 reports (does nothing outside the first week of the month)
        run: |
          curl --fail --show-error --silent --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/one-on-one"
      - name: Overdue alerts and start-of-day reminders
        run: |
          curl --fail --show-error --silent --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/notify"
